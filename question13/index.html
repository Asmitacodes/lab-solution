<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Username Availability Check</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
        }

        .container {
            max-width: 400px;
            margin: auto;
            background: #fff;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        .status {
            font-size: 14px;
            color: #555;
            text-align: center;
        }

        .available {
            color: green;
        }

        .not-available {
            color: red;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Reset Password</h1>
        <label for="username">Enter Username:</label>
        <input type="text" id="username" placeholder="Type your username">
        <div id="status" class="status"></div>
    </div>

    <script>
        document.getElementById("username").addEventListener("input", function () {
            const username = this.value.trim();
            const status = document.getElementById("status");

            // Clear status if input is empty
            if (username === "") {
                status.textContent = "";
                status.className = "status";
                return;
            }

            // Create XMLHttpRequest object
            const xhr = new XMLHttpRequest();

            // Define callback function
            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    if (xhr.responseText === "available") {
                        status.textContent = "Username available";
                        status.className = "status available";
                    } else {
                        status.textContent = "Username not available";
                        status.className = "status not-available";
                    }
                }
            };

            // Configure and send the request
            xhr.open("POST", "check_username.php", true);
            xhr.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");
            xhr.send("username=" + encodeURIComponent(username));
        });
    </script>
</body>
</html>
