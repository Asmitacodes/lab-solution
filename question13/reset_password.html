<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset</title>
    <style>
        #status {
            margin-top: 10px;
            font-weight: bold;
        }

        .available {
            color: green;
        }

        .unavailable {
            color: red;
        }
    </style>
</head>
<body>
    <h1>Password Reset</h1>
    <label for="username">Enter Username:</label>
    <input type="text" id="username" onkeyup="checkUsername()" />
    <div id="status"></div>

    <script>
        function checkUsername() {
            const username = document.getElementById('username').value;
            const statusDiv = document.getElementById('status');

            if (username === "") {
                statusDiv.innerHTML = "";
                return;
            }

            // Create an XMLHttpRequest object
            const xhr = new XMLHttpRequest();

            // Define the request
            xhr.open("POST", "check_username.php", true);
            xhr.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");

            // Define the response handler
            xhr.onload = function () {
                if (xhr.status === 200) {
                    if (xhr.responseText === "available") {
                        statusDiv.innerHTML = "Username available!";
                        statusDiv.className = "available";
                    } else {
                        statusDiv.innerHTML = "Username not available!";
                        statusDiv.className = "unavailable";
                    }
                } else {
                    statusDiv.innerHTML = "Error checking username.";
                    statusDiv.className = "unavailable";
                }
            };

            // Send the request
            xhr.send("username=" + encodeURIComponent(username));
        }
    </script>
</body>
</html>
