<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Colors</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .number {
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
            border-radius: 5px;
            color: white;
        }
        .even {
            background-color: green;
        }
        .odd {
            background-color: yellow;
            color: black;
        }
        .prime {
            background-color: red;
        }
    </style>
</head>
<body>
    <h1>Numbers 0 to 100 with Colors</h1>
    <div class="container" id="numberContainer"></div>

    <script>
        const container = document.getElementById('numberContainer');

        // Function to check if a number is prime
        function isPrime(num) {
            if (num < 2) return false;
            for (let i = 2; i <= Math.sqrt(num); i++) {
                if (num % i === 0) return false;
            }
            return true;
        }

        // Generate numbers and append to the container
        for (let i = 0; i <= 100; i++) {
            const numberDiv = document.createElement('div');
            numberDiv.textContent = i;
            numberDiv.classList.add('number');

            if (isPrime(i)) {
                numberDiv.classList.add('prime');
            } else if (i % 2 === 0) {
                numberDiv.classList.add('even');
            } else {
                numberDiv.classList.add('odd');
            }

            container.appendChild(numberDiv);
        }
    </script>
</body>
</html>
