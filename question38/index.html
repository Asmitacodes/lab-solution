<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Events</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="buttons">
            <button id="changeBg">Change Background</button>
            <button id="changeParaBg">Change Paragraph Background</button>
            <button id="hidePara">Hide Paragraph</button>
            <button id="showPara">Show Paragraph</button>
            <button id="increaseFontSize">Increase font Size by 2pt.</button>
            <button id="decreaseFontSize">Decrease font Size by 2pt.</button>
            <button id="resetFontSize">Reset font into 12 pt.</button>
            <button id="changeTextColor">Change Text Color</button>
        </div>
        <p id="paragraph">This is a sample paragraph. Use the buttons above to perform various actions on this paragraph.</p>
    </div>
    <script src="script.js"></script>
</body>
</html>
