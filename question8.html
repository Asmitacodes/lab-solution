<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery Effects Demo</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        #effectBox {
            width: 200px;
            height: 200px;
            background-color: lightblue;
            margin: 20px auto;
            text-align: center;
            line-height: 200px;
            font-size: 18px;
        }
        button {
            margin: 5px;
        }
    </style>
</head>
<body>
    <h1>jQuery Effects Demo</h1>
    <div id="effectBox">Effect Box</div>
    
    <!-- Buttons for effects -->
    <button id="btnHide">Hide</button>
    <button id="btnShow">Show</button>
    <button id="btnToggle">Toggle</button>
    <button id="btnFadeIn">Fade In</button>
    <button id="btnFadeOut">Fade Out</button>
    <button id="btnFadeToggle">Fade Toggle</button>
    <button id="btnSlideUp">Slide Up</button>
    <button id="btnSlideDown">Slide Down</button>
    <button id="btnSlideToggle">Slide Toggle</button>
    <button id="btnAnimate">Animate</button>

    <script>
        $(document).ready(function () {
            // Hide effect
            $("#btnHide").click(function () {
                $("#effectBox").hide();
            });

            // Show effect
            $("#btnShow").click(function () {
                $("#effectBox").show();
            });

            // Toggle effect
            $("#btnToggle").click(function () {
                $("#effectBox").toggle();
            });

            // Fade In effect
            $("#btnFadeIn").click(function () {
                $("#effectBox").fadeIn();
            });

            // Fade Out effect
            $("#btnFadeOut").click(function () {
                $("#effectBox").fadeOut();
            });

            // Fade Toggle effect
            $("#btnFadeToggle").click(function () {
                $("#effectBox").fadeToggle();
            });

            // Slide Up effect
            $("#btnSlideUp").click(function () {
                $("#effectBox").slideUp();
            });

            // Slide Down effect
            $("#btnSlideDown").click(function () {
                $("#effectBox").slideDown();
            });

            // Slide Toggle effect
            $("#btnSlideToggle").click(function () {
                $("#effectBox").slideToggle();
            });

            // Animate effect
            $("#btnAnimate").click(function () {
                $("#effectBox").animate({
                    width: "300px",
                    height: "300px",
                    marginLeft: "50px"
                }, 1000, function () {
                    // Callback to reset the box after animation
                    $(this).animate({
                        width: "200px",
                        height: "200px",
                        marginLeft: "0px"
                    }, 1000);
                });
            });
        });
    </script>
</body>
</html>
