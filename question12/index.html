<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie List</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }

        table, th, td {
            border: 1px solid black;
        }

        th, td {
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #f4f4f4;
        }

        img {
            width: 50px;
            height: auto;
        }
    </style>
</head>
<body>
    <h1>Movie List</h1>
    <button id="load-movies">Load Movies</button>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Poster</th>
                <th>Year</th>
                <th>Genre</th>
                <th>Rating</th>
                <th>Director</th>
                <th>Country</th>
                <th>Language</th>
                <th>Actors</th>
            </tr>
        </thead>
        <tbody id="movie-table-body">
            <!-- Movie rows will be added here dynamically -->
        </tbody>
    </table>

    <script>
        $(document).ready(function () {
            $('#load-movies').click(function () {
                // Fetch data from API
                $.ajax({
                    url: 'https://freetestapi.com/api/v1/movies',
                    method: 'GET',
                    success: function (data) {
                        console.log("movies",data)
                        const movies = data; // Assuming API returns an array of movies
                        const tableBody = $('#movie-table-body');
                        tableBody.empty(); // Clear any existing rows

                        movies.forEach(movie => {
                            const row = `
                                <tr>
                                    <td>${movie.id}</td>
                                    <td>${movie.title}</td>
                                    <td><img src="${movie.poster}" alt="${movie.title} Poster"></td>
                                    <td>${movie.year}</td>
                                    <td>${movie.genre}</td>
                                    <td>${movie.rating}</td>
                                    <td>${movie.director}</td>
                                    <td>${movie.country}</td>
                                    <td>${movie.language}</td>
                                    <td>${movie.actors.join(', ')}</td>
                                </tr>
                            `;
                            tableBody.append(row);
                        });
                    },
                    error: function () {
                        alert('Failed to load movies. Please try again later.');
                    }
                });
            });
        });
    </script>
</body>
</html>
